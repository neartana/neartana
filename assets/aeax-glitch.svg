<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1314 520" width="1314" height="520" role="img" aria-label="AEAX - glitch slice">
<style>
  .blk { font-family: ui-monospace, 'Courier New', monospace; font-size: 46px; }
  .corner { font-family: ui-monospace, 'Courier New', monospace; font-size: 15px; letter-spacing: 3px; fill: #4A7A85; }
  .cat { font-family: ui-monospace, 'Courier New', monospace; font-size: 16px; fill: #4A7A85; opacity: 0.8; }

  .front { fill: #D9F5EE; animation: fadein 0.5s ease-out both, frontshift 3.6s steps(1, end) infinite; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes frontshift {
    0%, 7.9%   { transform: translateX(0); }
    8%         { transform: translateX(2px); }
    10.5%      { transform: translateX(-2px); }
    13%, 60.9% { transform: translateX(0); }
    61%        { transform: translateX(-2px); }
    63.5%      { transform: translateX(2px); }
    66%, 100%  { transform: translateX(0); }
  }

  .gred  { fill: #FF4D6D; opacity: 0; animation: glitch-red 3.6s steps(1, end) infinite; }
  .gcyan { fill: #22D3EE; opacity: 0; animation: glitch-cyan 3.6s steps(1, end) infinite; }
  @keyframes glitch-red {
    0%, 7.9%   { opacity: 0;    transform: translateX(-5px); }
    8%         { opacity: 0.85; transform: translateX(-8px); }
    10%        { opacity: 0.85; transform: translateX(3px); }
    12%        { opacity: 0.85; transform: translateX(-5px); }
    13%, 60.9% { opacity: 0;    transform: translateX(-5px); }
    61%        { opacity: 0.85; transform: translateX(3px); }
    63%        { opacity: 0.85; transform: translateX(-8px); }
    65%        { opacity: 0.85; transform: translateX(-5px); }
    66%, 100%  { opacity: 0;    transform: translateX(-5px); }
  }
  @keyframes glitch-cyan {
    0%, 7.9%   { opacity: 0;    transform: translateX(5px); }
    8%         { opacity: 0.85; transform: translateX(8px); }
    10%        { opacity: 0.85; transform: translateX(-3px); }
    12%        { opacity: 0.85; transform: translateX(5px); }
    13%, 60.9% { opacity: 0;    transform: translateX(5px); }
    61%        { opacity: 0.85; transform: translateX(-3px); }
    63%        { opacity: 0.85; transform: translateX(8px); }
    65%        { opacity: 0.85; transform: translateX(5px); }
    66%, 100%  { opacity: 0;    transform: translateX(5px); }
  }
</style>
